<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ออฟไลน์ — ระบบข้อสอบ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 400px; width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .icon { font-size: 72px; margin-bottom: 12px; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    h1 { color: #1e293b; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; border: none;
      padding: 14px 28px; border-radius: 14px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 24px rgba(102,126,234,.4);
      transition: transform .15s;
    }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📵</div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>คุณสามารถใช้งานบางฟีเจอร์ที่เคยเข้าแล้วได้<br/>ลองเชื่อมต่อใหม่แล้วกดปุ่มด้านล่าง</p>
    <button onclick="location.reload()">🔄 ลองใหม่</button>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
