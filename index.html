<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบข้อสอบออนไลน์</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ข้อสอบ" />
  <link rel="manifest" href="/online-exam-system/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/online-exam-system/sw.js').then(reg => {
          // ตรวจหา SW ใหม่ทุก 60 นาที
          setInterval(() => { try { reg.update(); } catch(_) {} }, 60 * 60 * 1000);

          // แจ้งเตือนเมื่อมี SW เวอร์ชันใหม่พร้อมใช้งาน
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // ส่ง event ให้ React แสดง toast
                window.dispatchEvent(new CustomEvent('sw-update-ready', { detail: { worker: nw } }));
              }
            });
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
